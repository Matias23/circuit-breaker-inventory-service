spring:
  application:
    name: circuit-breaker-inventory-service
  threads:
    virtual:
      enabled: true
  datasource:
    # DB_CLOSE_DELAY=-1 keeps the in-memory schema alive between pooled connections.
    url: jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,mappings,beans
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
    env:
      # Local demo only: never expose raw values outside a dev machine.
      show-values: always
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Stock provider with injectable faults
